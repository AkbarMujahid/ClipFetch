<!DOCTYPE html>
<html>
<head>
  <title>ClipFetch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="/logo.png">

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;

      overflow-y: auto;
      overflow-x: hidden;

      background: linear-gradient(
        -45deg,
        #0f2027,
        #203a43,
        #2c5364,
        #1e3c72
      );

      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      transition: 0.3s;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    body.light {
      background: #f5f5f5;
      color: #111;
      animation: none;
    }

    .app {
      width: 100%;
      max-width: 520px;
      padding: 25px;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 28px;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    body.light .card {
      background: white;
      color: black;
    }

    /* =========================
       TOP BAR
    ========================= */

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .app-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 600;
    }

    .logo {
      width: 50px;
      height: 50px;
      border-radius: 14px;

      box-shadow: 0 0 20px rgba(0, 198, 255, 0.6);

      transition: 0.3s;
    }

    .logo:hover {
      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 0 30px rgba(255, 0, 204, 0.8);
    }

    .brand-text {
      background: linear-gradient(90deg, #00c6ff, #ff00cc);

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .toggle {
      cursor: pointer;
      font-size: 20px;
      transition: 0.3s;
    }

    .toggle:hover {
      transform: rotate(20deg) scale(1.2);
    }

    /* =========================
       INPUT
    ========================= */

    .input-group {
      display: flex;
      align-items: center;

      background: rgba(255, 255, 255, 0.1);

      border-radius: 14px;
      padding: 12px;
      margin-top: 15px;

      transition: 0.3s;
    }

    .input-group:focus-within {
      background: rgba(255, 255, 255, 0.2);

      box-shadow: 0 0 10px rgba(30, 136, 229, 0.5);
    }

    body.light .input-group {
      background: #eee;
    }

    #platformIcon {
      margin-right: 10px;
      font-size: 18px;
      transition: 0.3s;
    }

    input {
      flex: 1;

      border: none;
      background: transparent;
      outline: none;

      color: inherit;

      font-size: 16px;
      min-width: 0;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    body.light input::placeholder {
      color: #777;
    }

    /* =========================
       MAIN BUTTON
    ========================= */

    .btn {
      margin-top: 14px;

      padding: 14px;
      width: 100%;

      border-radius: 14px;
      border: none;

      background: linear-gradient(90deg, #1e88e5, #42a5f5);

      color: white;

      cursor: pointer;
      font-size: 16px;

      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.03);

      box-shadow: 0 10px 25px rgba(30, 136, 229, 0.5);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* =========================
       DOWNLOAD PROGRESS
    ========================= */

    .progress-box {
      margin-top: 16px;

      padding: 14px;

      border-radius: 14px;

      background: rgba(255, 255, 255, 0.08);
    }

    .progress-box[hidden] {
      display: none;
    }

    body.light .progress-box {
      background: #f1f1f1;
    }

    .progress-head,
    .progress-foot {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      font-size: 14px;
    }

    .progress-head {
      font-weight: 600;
    }

    .progress-track {
      height: 8px;

      margin: 10px 0;

      border-radius: 8px;

      overflow: hidden;

      background: rgba(255, 255, 255, 0.12);
    }

    body.light .progress-track {
      background: #ddd;
    }

    .progress-bar {
      width: 0;
      height: 100%;

      border-radius: 8px;

      background: linear-gradient(90deg, #00c6ff, #ff00cc);

      transition: width 0.3s;
    }

    .progress-bar.busy {
      width: 100% !important;

      background-size: 200% 100%;

      animation: gradientBG 1.5s linear infinite;
    }

    .progress-foot {
      font-size: 12px;

      color: rgba(255, 255, 255, 0.6);
    }

    body.light .progress-foot {
      color: #777;
    }

    .cancel-btn {
      border: none;

      background: rgba(255, 107, 107, 0.15);

      color: #ff6b6b;

      padding: 6px 10px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 12px;
    }

    .cancel-btn:hover {
      background: #ff6b6b;

      color: white;
    }

    /* =========================
       VIDEO INFORMATION
    ========================= */

    #title {
      margin-top: 18px;
      margin-bottom: 8px;

      font-size: 18px;
      line-height: 1.4;
    }

    #thumbnail {
      width: 100%;

      margin-top: 12px;

      border-radius: 14px;

      display: none;

      max-height: 280px;
      object-fit: cover;
    }

    /* =========================
       FORMAT SECTION
    ========================= */

    .formats {
      margin-top: 20px;

      scroll-margin-top: 20px;
    }

    /* =========================
       VIDEO / AUDIO TABS
    ========================= */

    .mode-tabs {
      display: flex;

      width: 100%;

      margin-bottom: 12px;

      border-radius: 12px;

      overflow: hidden;

      background: rgba(255, 255, 255, 0.08);
    }

    .mode-tab {
      flex: 1;

      border: none;

      padding: 13px 10px;

      background: transparent;

      color: rgba(255, 255, 255, 0.65);

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.3s;
    }

    .mode-tab:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .mode-tab.active {
      background: rgba(255, 255, 255, 0.15);

      color: white;

      box-shadow: inset 0 -2px 0 #42a5f5;
    }

    body.light .mode-tabs {
      background: #eee;
    }

    body.light .mode-tab {
      color: #777;
    }

    body.light .mode-tab.active {
      background: white;
      color: #111;
    }

    /* =========================
       FORMAT ITEMS
    ========================= */

    .format-btn {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      background: rgba(255, 255, 255, 0.08);

      padding: 13px;

      margin: 8px 0;

      border-radius: 14px;

      cursor: pointer;

      transition: 0.3s;

      text-align: left;
    }

    .format-btn:hover {
      transform: translateY(-3px);

      background: rgba(255, 255, 255, 0.16);

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    body.light .format-btn {
      background: #f1f1f1;
    }

    body.light .format-btn:hover {
      background: #e5e5e5;
    }

    .format-info {
      display: flex;

      align-items: center;

      gap: 10px;

      min-width: 0;
    }

    .format-icon {
      width: 38px;
      height: 38px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: rgba(30, 136, 229, 0.18);

      color: #42a5f5;

      flex-shrink: 0;
    }

    .audio-format .format-icon {
      background: rgba(255, 0, 204, 0.15);

      color: #ff4bd8;
    }

    .format-text {
      display: flex;

      flex-direction: column;

      gap: 2px;

      min-width: 0;
    }

    .format-quality {
      font-weight: 600;

      font-size: 15px;
    }

    .format-description {
      font-size: 12px;

      color: rgba(255, 255, 255, 0.55);
    }

    body.light .format-description {
      color: #777;
    }

    .download-label {
      display: flex;

      align-items: center;

      gap: 6px;

      background: #42a5f5;

      padding: 9px 12px;

      border-radius: 9px;

      color: white;

      font-size: 13px;

      font-weight: 600;

      flex-shrink: 0;
    }

    .audio-format .download-label {
      background: #d633a6;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      text-align: center;

      margin-top: 12px;

      font-size: 14px;

      color: #ccc;

      line-height: 1.5;
    }

    body.light #status {
      color: #555;
    }

    /* =========================
       HISTORY
    ========================= */

    .history {
      margin-top: 24px;
    }

    .history-header {
      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .history-header h4 {
      margin: 0 0 10px 0;
    }

    .clear-history {
      cursor: pointer;

      font-size: 12px;

      color: #ff6b6b;

      margin-bottom: 10px;
    }

    .history-item {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      padding: 9px;

      margin-bottom: 7px;

      border-radius: 10px;

      background: rgba(255, 255, 255, 0.08);

      font-size: 13px;

      transition: 0.3s;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .history-left {
      display: flex;

      align-items: center;

      gap: 10px;

      min-width: 0;
    }

    .history-left img {
      width: 50px;
      height: 35px;

      object-fit: cover;

      border-radius: 6px;

      flex-shrink: 0;
    }

    .history-text {
      overflow: hidden;
    }

    .history-title {
      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      max-width: 230px;
    }

    .history-type {
      font-size: 11px;

      color: rgba(255, 255, 255, 0.5);

      margin-top: 2px;
    }

    body.light .history-item {
      background: #f1f1f1;
    }

    body.light .history-type {
      color: #777;
    }

    .redownload-btn {
      border: none;

      background: rgba(30, 136, 229, 0.18);

      color: #42a5f5;

      padding: 7px 9px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 12px;

      flex-shrink: 0;
    }

    .redownload-btn:hover {
      background: #1e88e5;

      color: white;
    }

    /* =========================
       EMPTY / ERROR
    ========================= */

    .empty-message {
      text-align: center;

      padding: 15px;

      color: rgba(255, 255, 255, 0.6);

      font-size: 14px;
    }

    body.light .empty-message {
      color: #777;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
      }

      .app {
        padding: 15px;
        margin-top: 15px;
      }

      .card {
        padding: 20px;

        border-radius: 18px;
      }

      .app-title {
        font-size: 21px;
      }

      .logo {
        width: 44px;
        height: 44px;
      }

      .format-btn {
        padding: 11px;
      }

      .download-label {
        padding: 8px 10px;

        font-size: 12px;
      }

      .history-title {
        max-width: 150px;
      }
    }

    @media (max-width: 400px) {
      .card {
        padding: 16px;
      }

      .mode-tab {
        font-size: 14px;
      }

      .format-description {
        display: none;
      }

      .download-label {
        padding: 8px;
      }

      .download-label span {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <div class="card">

    <!-- =========================
         TOP BAR
    ========================= -->

    <div class="top-bar">

      <div class="app-title">

        <img src="/logo.png" class="logo" alt="ClipFetch">

        <span class="brand-text">
          ClipFetch
        </span>

      </div>

      <div
        class="toggle"
        onclick="toggleTheme()"
        title="Toggle theme"
      >
        <i
          id="themeIcon"
          class="fa-solid fa-sun"
        ></i>
      </div>

    </div>


    <!-- =========================
         URL INPUT
    ========================= -->

    <div class="input-group">

      <i
        id="platformIcon"
        class="fa-solid fa-link"
      ></i>

      <input
        id="url"
        type="text"
        placeholder="Paste video link"
        autocomplete="off"
      >

    </div>


    <!-- =========================
         FETCH BUTTON
    ========================= -->

    <button
      id="fetchBtn"
      class="btn"
      onclick="getFormats()"
    >
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      Get Formats
    </button>


    <!-- =========================
         VIDEO INFO
    ========================= -->

    <h3 id="title"></h3>

    <img
      id="thumbnail"
      alt="Video thumbnail"
    >


    <!-- =========================
         FORMAT AREA
    ========================= -->

    <div
      id="formats"
      class="formats"
    ></div>


    <!-- =========================
         DOWNLOAD PROGRESS
    ========================= -->

    <div
      id="progressBox"
      class="progress-box"
      hidden
    >

      <div class="progress-head">
        <span id="progressLabel">Starting…</span>
        <span id="progressPercent"></span>
      </div>

      <div class="progress-track">
        <div
          id="progressBar"
          class="progress-bar"
        ></div>
      </div>

      <div class="progress-foot">
        <span id="progressMeta"></span>

        <button
          id="cancelBtn"
          class="cancel-btn"
          type="button"
          onclick="cancelDownload()"
        >
          Cancel
        </button>
      </div>

    </div>


    <!-- =========================
         STATUS
    ========================= -->

    <div id="status"></div>


    <!-- =========================
         HISTORY
    ========================= -->

    <div class="history">

      <div class="history-header">

        <h4>
          Recent Downloads
        </h4>

        <span
          class="clear-history"
          onclick="clearHistory()"
        >
          Clear
        </span>

      </div>

      <div id="historyList"></div>

    </div>

  </div>
</div>


<script>

  /* =========================
     API
  ========================= */

  const API = "";


  /* =========================
     GLOBAL STATE
  ========================= */

  let currentVideoData = null;

  let currentUrl = "";

  let currentMode = "video";

  let activeJob = null;


  const themeIcon =
    document.getElementById("themeIcon");

  const urlInput =
    document.getElementById("url");

  const formatsContainer =
    document.getElementById("formats");

  const statusElement =
    document.getElementById("status");

  const fetchBtn =
    document.getElementById("fetchBtn");

  const progressBox =
    document.getElementById("progressBox");

  const progressLabel =
    document.getElementById("progressLabel");

  const progressPercent =
    document.getElementById("progressPercent");

  const progressBar =
    document.getElementById("progressBar");

  const progressMeta =
    document.getElementById("progressMeta");


  /* =========================
     LOAD HISTORY
  ========================= */

  function loadHistory() {

    const list =
      document.getElementById("historyList");

    list.innerHTML = "";

    const history =
      JSON.parse(
        localStorage.getItem("history")
      ) || [];


    if (history.length === 0) {

      const empty =
        document.createElement("div");

      empty.className =
        "empty-message";

      empty.innerText =
        "Your downloads will appear here.";

      list.appendChild(empty);

      return;
    }


    history.forEach(item => {

      const div =
        document.createElement("div");

      div.className =
        "history-item";


      const left =
        document.createElement("div");

      left.className =
        "history-left";


      const img =
        document.createElement("img");

      img.src =
        item.thumbnail || "/logo.png";

      img.alt =
        "Thumbnail";


      const textContainer =
        document.createElement("div");

      textContainer.className =
        "history-text";


      const title =
        document.createElement("div");

      title.className =
        "history-title";

      title.innerText =
        item.title || "Video";


      const type =
        document.createElement("div");

      type.className =
        "history-type";


      if (item.type === "audio") {

        type.innerText =
          "🎵 MP3 • " +
          (item.quality || "Audio");

      } else {

        type.innerText =
          "🎬 Video • " +
          (item.quality || "Video");

      }


      textContainer.appendChild(title);

      textContainer.appendChild(type);


      left.appendChild(img);

      left.appendChild(textContainer);


      const btn =
        document.createElement("button");

      btn.className =
        "redownload-btn";

      btn.innerHTML =
        '<i class="fa-solid fa-download"></i>';


      btn.title =
        "Download again";


      btn.onclick = () => {

        startDownload({
          url: item.url,
          quality: item.quality,
          type: item.type || "video",
          title: item.title,
          thumbnail: item.thumbnail
        });
      };


      div.appendChild(left);

      div.appendChild(btn);

      list.appendChild(div);

    });
  }


  /* =========================
     SAVE HISTORY
  ========================= */

  function saveHistory(
    url,
    quality,
    title,
    thumbnail,
    type
  ) {

    let history =
      JSON.parse(
        localStorage.getItem("history")
      ) || [];


    history = history.filter(item =>
      !(
        item.url === url &&
        item.quality === quality &&
        item.type === type
      )
    );


    history.unshift({
      url,
      quality,
      title,
      thumbnail,
      type
    });


    if (history.length > 10) {

      history.pop();

    }


    localStorage.setItem(
      "history",
      JSON.stringify(history)
    );
  }


  /* =========================
     CLEAR HISTORY
  ========================= */

  function clearHistory() {

    localStorage.removeItem("history");

    loadHistory();
  }


  /* =========================
     THEME
  ========================= */

  window.onload = () => {

    loadHistory();


    const saved =
      localStorage.getItem("theme") ||
      "dark";


    if (saved === "light") {

      document.body.classList.add(
        "light"
      );

      themeIcon.className =
        "fa-solid fa-moon";

    }

  };


  function toggleTheme() {

    const isLight =
      document.body.classList.contains(
        "light"
      );


    if (isLight) {

      document.body.classList.remove(
        "light"
      );

      localStorage.setItem(
        "theme",
        "dark"
      );

      themeIcon.className =
        "fa-solid fa-sun";

    } else {

      document.body.classList.add(
        "light"
      );

      localStorage.setItem(
        "theme",
        "light"
      );

      themeIcon.className =
        "fa-solid fa-moon";

    }
  }


  /* =========================
     PLATFORM ICON
  ========================= */

  urlInput.addEventListener(
    "input",
    function () {

      const url =
        this.value.toLowerCase();

      const icon =
        document.getElementById(
          "platformIcon"
        );


      if (
        url.includes("youtube") ||
        url.includes("youtu.be")
      ) {

        icon.className =
          "fa-brands fa-youtube";

        icon.style.color =
          "#FF0000";

      }

      else if (
        url.includes("instagram")
      ) {

        icon.className =
          "fa-brands fa-instagram";

        icon.style.color =
          "#E1306C";

      }

      else if (
        url.includes("facebook") ||
        url.includes("fb.watch")
      ) {

        icon.className =
          "fa-brands fa-facebook";

        icon.style.color =
          "#1877F2";

      }

      else {

        icon.className =
          "fa-solid fa-link";

        icon.style.color =
          "#ccc";
      }

    }
  );


  /* =========================
     GET FORMATS
  ========================= */

  async function getFormats() {

    const url =
      urlInput.value.trim();


    if (!url) {

      alert(
        "Please paste a video link first."
      );

      return;
    }


    currentUrl = url;


    /* Clear previous results */

    formatsContainer.innerHTML = "";

    document.getElementById(
      "title"
    ).innerText = "";

    document.getElementById(
      "thumbnail"
    ).style.display = "none";

    statusElement.innerText = "";


    /* Show loader */

    fetchBtn.disabled =
      true;

    fetchBtn.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Fetching...';


    /* Free servers sleep when idle, so the first request can be slow */

    const wakeTimer =
      setTimeout(() => {

        fetchBtn.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Waking up server...';

      }, 8000);


    try {

      const res =
        await fetch(
          API + "/api/formats",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                url
              })
          }
        );


      const data =
        await readJson(res);


      if (!res.ok) {

        throw new Error(
          data.error ||
          "Unable to fetch video information."
        );
      }


      currentVideoData =
        data;


      document.getElementById(
        "title"
      ).innerText =
        data.title || "Video";


      if (data.thumbnail) {

        const img =
          document.getElementById(
            "thumbnail"
          );

        img.src =
          data.thumbnail;

        img.style.display =
          "block";
      }


      renderModeTabs(
        data.formats || []
      );


      renderVideoFormats(
        data.formats || []
      );


      setTimeout(() => {

        formatsContainer.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 200);


    } catch (error) {

      console.error(
        "FORMAT ERROR:",
        error
      );


      statusElement.innerText =
        error.message ||
        "Something went wrong while fetching the video.";


      statusElement.style.color =
        "#ff6b6b";

    } finally {

      clearTimeout(wakeTimer);

      fetchBtn.disabled =
        false;

      fetchBtn.innerHTML =
        '<i class="fa-solid fa-wand-magic-sparkles"></i> Get Formats';

    }
  }

  /* =========================
     DOWNLOAD
  ========================= */

  function downloadCurrent(
    quality,
    type
  ) {

    if (!currentUrl) {

      alert(
        "Please fetch a video first."
      );

      return;
    }


    startDownload({
      url: currentUrl,
      quality,
      type,
      title: currentVideoData?.title || "Video",
      thumbnail: currentVideoData?.thumbnail || ""
    });
  }


  /*
     The server downloads the file first and reports
     progress over Server-Sent Events. When it is ready,
     the browser fetches the finished file.
  */

  async function startDownload(item) {

    if (activeJob) {

      showStatus(
        "Please wait for the current download to finish.",
        "error"
      );

      return;
    }


    saveHistory(
      item.url,
      item.quality,
      item.title,
      item.thumbnail,
      item.type
    );

    loadHistory();


    showStatus("");

    showProgress(
      item.type === "audio"
        ? "Preparing your MP3…"
        : "Preparing your video…",
      null,
      ""
    );


    activeJob = { id: null, source: null };


    try {

      const res =
        await fetch(
          API + "/api/download",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                url: item.url,
                quality: item.quality,
                type: item.type
              })
          }
        );


      const data =
        await readJson(res);


      if (!res.ok) {

        throw new Error(
          data.error ||
          "Couldn't start the download."
        );
      }


      trackJob(data.id);

    } catch (error) {

      activeJob = null;

      hideProgress();

      showStatus(
        error.message ||
        "Couldn't start the download.",
        "error"
      );
    }
  }


  function trackJob(id) {

    const source =
      new EventSource(
        `${API}/api/jobs/${id}/events`
      );

    activeJob = { id, source };


    source.onmessage = event => {

      renderJob(
        JSON.parse(event.data)
      );

    };


    /* EventSource reconnects by itself; stop only if the job is gone */

    source.onerror = async () => {

      const res =
        await fetch(`${API}/api/jobs/${id}`)
          .catch(() => null);


      if (
        activeJob?.id === id &&
        res &&
        res.status === 404
      ) {

        closeJob();

        hideProgress();

        showStatus(
          "This download expired. Please try again.",
          "error"
        );
      }
    };
  }


  function renderJob(job) {

    if (job.status === "queued") {

      showProgress(
        `Waiting in queue (#${job.queuePosition})…`,
        null,
        "The server is busy with other downloads"
      );

    } else if (job.status === "downloading") {

      showProgress(
        job.message || "Downloading…",
        job.percent,
        [
          job.speed,
          job.eta && "ETA " + job.eta
        ].filter(Boolean).join(" • ")
      );

    } else if (job.status === "processing") {

      showProgress(
        job.message || "Processing…",
        null,
        "Almost done"
      );

    } else if (job.status === "done") {

      closeJob();

      showProgress(
        "Download ready!",
        100,
        ""
      );

      showStatus(
        "✓ Saving " + job.filename
      );

      window.location.href =
        `${API}/api/jobs/${job.id}/file`;

      setTimeout(hideProgress, 3000);

    } else {

      closeJob();

      hideProgress();

      showStatus(
        job.status === "cancelled"
          ? "Download cancelled."
          : job.error || "Download failed.",
        job.status === "cancelled"
          ? ""
          : "error"
      );
    }
  }


  async function cancelDownload() {

    if (!activeJob?.id) return;

    await fetch(
      `${API}/api/jobs/${activeJob.id}/cancel`,
      { method: "POST" }
    ).catch(() => null);
  }


  function closeJob() {

    activeJob?.source?.close();

    activeJob = null;
  }


  /* =========================
     PROGRESS UI
  ========================= */

  /* percent = null shows an animated "busy" bar */

  function showProgress(
    label,
    percent,
    meta
  ) {

    progressBox.hidden = false;

    progressLabel.innerText = label;

    progressMeta.innerText = meta || "";


    if (percent === null) {

      progressBar.classList.add("busy");

      progressPercent.innerText = "";

    } else {

      progressBar.classList.remove("busy");

      progressBar.style.width =
        percent + "%";

      progressPercent.innerText =
        Math.round(percent) + "%";
    }
  }


  function hideProgress() {

    progressBox.hidden = true;

    progressBar.style.width = "0";
  }


  function showStatus(
    message,
    kind
  ) {

    statusElement.innerText =
      message;

    statusElement.style.color =
      kind === "error"
        ? "#ff6b6b"
        : "";
  }


  /* =========================
     HELPERS
  ========================= */

  /* Error pages from the host (e.g. while the server wakes up) are not JSON */

  async function readJson(res) {

    try {

      return await res.json();

    } catch {

      return {
        error:
          "The server isn't responding right now. Please try again in a moment."
      };
    }
  }


  function describeVideoQuality(quality) {

    const height =
      parseInt(quality, 10);


    if (height >= 2160) return "4K MP4 Video";

    if (height >= 1440) return "2K MP4 Video";

    if (height >= 1080) return "Full HD MP4 Video";

    if (height >= 720) return "HD MP4 Video";

    if (height) return "MP4 Video";

    return "Best available quality";
  }

     ENTER KEY

  urlInput.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key === "Enter"
      ) {

        getFormats();

      }

    }
  );
